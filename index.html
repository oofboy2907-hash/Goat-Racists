
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GOAT RACING LEAGUE</title>
<style>
body {
    background: #17251b;
    color: white;
    font-family: Arial;
    text-align: center;
    padding: 20px;
}
h1 { color: gold; font-size: 40px; }
.track {
    background: #496b39;
    border: 5px solid #d2a65a;
    border-radius: 12px;
    padding: 15px;
    margin: 20px auto;
    max-width: 800px;
}
.lane {
    height: 65px;
    border-bottom: 2px dashed white;
    position: relative;
    display: flex;
    align-items: center;
}
.goat {
    font-size: 35px;
    position: absolute;
    left: 0;
    z-index: 2;
}
.finish {
    position: absolute;
    right: 5px;
    height: 100%;
    border-right: 5px solid white;
}
button {
    background: gold;
    border: none;
    border-radius: 8px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin: 8px;
}
button:disabled { opacity: .5; cursor: not-allowed; }
input {
    width: 100px;
    padding: 7px;
    border-radius: 5px;
    border: none;
}
table {
    margin: 20px auto;
    border-collapse: collapse;
    width: 95%;
    max-width: 750px;
}
td, th {
    padding: 10px;
    border: 1px solid #777;
}
.buff { color: #64ff64; }
.nerf { color: #ff6565; }
#winner {
    font-size: 28px;
    color: gold;
    font-weight: bold;
    margin: 20px;
}
.settings {
    background: #263b2c;
    padding: 15px;
    border-radius: 12px;
    max-width: 800px;
    margin: auto;
}
</style>
</head>
<body>

<h1>🐐 GOAT RACING LEAGUE 🐐</h1>
<p>Six goats. One winner. Infinite glory.</p>

<h2>🏁 RACE TRACK</h2>
<div class="track" id="track"></div>

<div id="winner">Ready to race?</div>

<button onclick="startRace()" id="raceButton">
START RACE
</button>

<button onclick="resetSettings()">RESET GOATS</button>

<h2>⚙️ GOAT MANAGEMENT</h2>
<div class="settings">
<p>Change names and luck multipliers. 1.0x = normal luck.</p>

<table>
<thead>
<tr>
<th>Goat</th>
<th>Name</th>
<th>Luck Multiplier</th>
<th>Win Odds</th>
</tr>
</thead>
<tbody id="settings"></tbody>
</table>

<p>
🟢 Above 1.0x = Buff |
🔴 Below 1.0x = Nerf
</p>
</div>

<script>
const defaults = [
    {name:"Sir Baa-a-lot", luck:1},
    {name:"Jeff", luck:1},
    {name:"The Destroyer", luck:1},
    {name:"Billy", luck:1},
    {name:"Goatzilla", luck:1},
    {name:"John Goat", luck:1}
];

let goats = defaults.map(g => ({...g}));
let racing = false;

function renderTrack() {
    const track = document.getElementById("track");
    track.innerHTML = "";

    goats.forEach((goat, i) => {
        const lane = document.createElement("div");
        lane.className = "lane";
        lane.innerHTML = `
            <span class="goat" id="goat${i}">🐐</span>
            <span style="margin-left:75px">${goat.name}</span>
            <div class="finish"></div>
        `;
        track.appendChild(lane);
    });
}

function renderSettings() {
    const total = goats.reduce((s,g) => s+g.luck,0);
    const settings = document.getElementById("settings");
    settings.innerHTML = "";

    goats.forEach((goat,i) => {
        const chance = goat.luck / total * 100;

        const row = document.createElement("tr");
        row.innerHTML = `
            <td>🐐 ${i+1}</td>
            <td>
                <input value="${goat.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;")}"
                    onchange="changeName(${i},this.value)">
            </td>
            <td>
                <input type="number" min="0.01" max="100"
                    step="0.1" value="${goat.luck}"
                    onchange="changeLuck(${i},this.value)">
            </td>
            <td class="${goat.luck>1?'buff':goat.luck<1?'nerf':''}">
                ${chance.toFixed(2)}%
            </td>
        `;
        settings.appendChild(row);
    });
}

function changeName(i,value) {
    goats[i].name = value.trim() || "Unnamed Goat";
    renderTrack();
    renderSettings();
}

function changeLuck(i,value) {
    const number = Number(value);
    if (!Number.isFinite(number) || number <= 0) {
        alert("Luck must be greater than zero!");
        renderSettings();
        return;
    }

    goats[i].luck = Math.min(number,100);
    renderSettings();
}

function resetSettings() {
    if(racing) return;
    goats = defaults.map(g => ({...g}));
    renderTrack();
    renderSettings();
}

function startRace() {
    if(racing) return;

    racing = true;
    const button = document.getElementById("raceButton");
    button.disabled = true;

    document.getElementById("winner").innerText =
        "🏁 THE RACE IS ON!";

    let progress = goats.map(() => 0);

    // Luck affects average speed, with random speed variation.
  let speeds = goats.map(g =>
    (0.15 + Math.random()*0.3) * g.luck
);
    const interval = setInterval(() => {
        goats.forEach((goat,i) => {
            progress[i] += speeds[i] * (0.7 + Math.random()*0.6);

            document.getElementById("goat"+i).style.left =
                Math.min(progress[i],85) + "%";
        });

        const winnerIndex = progress.findIndex(p => p >= 100);

        if(winnerIndex !== -1) {
            clearInterval(interval);

            document.getElementById("winner").innerText =
                "🏆 WINNER: " +
                goats[winnerIndex].name.toUpperCase() + "! 🏆";

            racing = false;
            button.disabled = false;
            button.innerText = "NEXT RACE";
        }
    },50);
}

renderTrack();
renderSettings();
</script>
</body>
</html>
